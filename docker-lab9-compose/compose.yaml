name: devops-lab9

services:
  db:
    image: postgres:15-alpine
    container_name: devops-lab9-db
    labels:
      devops.lab: "9"
    environment:
      POSTGRES_USER: ${DB_USER:?Run configure.sh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run configure.sh}
      POSTGRES_DB: ${DB_NAME:?Run configure.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devops-lab9-redis
    labels:
      devops.lab: "9"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  api:
    build:
      context: ./api
      labels:
        devops.lab: "9"
    image: devops-lab9-api:1.0
    container_name: devops-lab9-api
    labels:
      devops.lab: "9"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Run configure.sh}
      DB_USER: ${DB_USER:?Run configure.sh}
      DB_PASSWORD: ${DB_PASSWORD:?Run configure.sh}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
    ports:
      - "127.0.0.1:${API_PORT:-5059}:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

networks:
  backend:
    name: devops-lab9-backend
    driver: bridge
    labels:
      devops.lab: "9"

volumes:
  postgres_data:
    name: devops-lab9-postgres-data
    labels:
      devops.lab: "9"
  redis_data:
    name: devops-lab9-redis-data
    labels:
      devops.lab: "9"
